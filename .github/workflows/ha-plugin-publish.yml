name: Publish signed Home Assistant plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: Public plugin version, for example 1.0.0
        required: true
        type: string
      connector_commit:
        description: Full reviewed Home Assistant connector commit
        required: true
        type: string
      sdk_tag:
        description: Published connector SDK tag used by the connector
        required: true
        type: string
      sdk_commit:
        description: Full commit referenced by the SDK tag
        required: true
        type: string
      publish:
        description: Create the public GitHub Release and Pages catalog PR
        required: true
        default: false
        type: boolean

concurrency:
  group: ha-plugin-publish-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source
      - name: Validate release inputs and published source
        env:
          VERSION: ${{ inputs.version }}
          CONNECTOR_COMMIT: ${{ inputs.connector_commit }}
          SDK_TAG: ${{ inputs.sdk_tag }}
          SDK_COMMIT: ${{ inputs.sdk_commit }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$CONNECTOR_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SDK_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SDK_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git -C source rev-parse HEAD)" = "$GITHUB_SHA"
          test -f source/agent/cmd/tp-agent/main.go
          test -f source/tools/plugin_catalog.py
          git ls-remote --tags https://github.com/ThingsPanel/device-connector-sdk-go.git "refs/tags/$SDK_TAG" "refs/tags/$SDK_TAG^{}" > "$RUNNER_TEMP/sdk-ref"
          actual=$(awk '/\^\{\}$/ {print $1; found=1} END {if (!found) {}}' "$RUNNER_TEMP/sdk-ref")
          if [ -z "$actual" ]; then actual=$(awk 'NR==1 {print $1}' "$RUNNER_TEMP/sdk-ref"); fi
          test "$actual" = "$SDK_COMMIT"
      - uses: actions/checkout@v4
        with:
          repository: ThingsPanel/thingspanel-device-connector-homeassistant
          ref: ${{ inputs.connector_commit }}
          path: source/ha-connector
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build Agent and architecture-specific connector image
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ inputs.version }}
          CONNECTOR_COMMIT: ${{ inputs.connector_commit }}
          SDK_TAG: ${{ inputs.sdk_tag }}
        run: |
          set -euo pipefail
          test "$(git -C source/ha-connector rev-parse HEAD)" = "$CONNECTOR_COMMIT"
          test -z "$(git -C source/ha-connector status --porcelain)"
          python3 -c 'import pathlib,sys; s=pathlib.Path("source/ha-connector/go.mod").read_text(); assert "replace github.com/thingspanel/device-connector-sdk-go" not in s; assert ("github.com/thingspanel/device-connector-sdk-go " + sys.argv[1]) in s' "$SDK_TAG"
          mkdir -p out
          (cd source/agent && GOOS=linux GOARCH="$ARCH" CGO_ENABLED=0 go build -trimpath -buildvcs=false -o "../../out/tp-agent-linux-$ARCH" ./cmd/tp-agent)
          docker buildx build --platform "linux/$ARCH" --provenance=false --load --tag "thingspanel/homeassistant-connector:$VERSION-$ARCH" source/ha-connector
          docker image inspect "thingspanel/homeassistant-connector:$VERSION-$ARCH" > "$RUNNER_TEMP/image.json"
          python3 -c 'import json,os,pathlib; i=json.loads(pathlib.Path(os.environ["RUNNER_TEMP"],"image.json").read_text())[0]; assert i["Os"]=="linux" and i["Architecture"]==os.environ["ARCH"]; assert not (i.get("Config",{}).get("Labels") or i.get("Config",{}).get("Volumes") or i.get("Config",{}).get("OnBuild")); pathlib.Path(os.environ["RUNNER_TEMP"],"image-id").write_text(i["Id"])'
          docker save -o "out/ha-image-linux-$ARCH.tar" "thingspanel/homeassistant-connector:$VERSION-$ARCH"
      - name: Sign catalog and verify with the shipped trust root
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ inputs.version }}
          CONNECTOR_COMMIT: ${{ inputs.connector_commit }}
          SDK_COMMIT: ${{ inputs.sdk_commit }}
          INSTALLER_COMMIT: ${{ github.sha }}
          SIGNING_KEY: ${{ secrets.TP_PLUGIN_CATALOG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY"
          umask 077
          key="$RUNNER_TEMP/plugin-signing-key.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key"
          export IMAGE_ID="$(cat "$RUNNER_TEMP/image-id")"
          export IMAGE_SHA="$(sha256sum "out/ha-image-linux-$ARCH.tar" | cut -d' ' -f1)"
          export AGENT_SHA="$(sha256sum "out/tp-agent-linux-$ARCH" | cut -d' ' -f1)"
          python3 -c 'import json,os,pathlib; e=json.loads(pathlib.Path("source/plugins/homeassistant.json").read_text()); e.update(version=os.environ["VERSION"], image_id=os.environ["IMAGE_ID"], image_platform="linux/"+os.environ["ARCH"], image_archive_sha256=os.environ["IMAGE_SHA"], source_commit=os.environ["CONNECTOR_COMMIT"], sdk_commit=os.environ["SDK_COMMIT"], installer_commit=os.environ["INSTALLER_COMMIT"]); pathlib.Path(os.environ["RUNNER_TEMP"],"homeassistant.json").write_text(json.dumps(e,sort_keys=True,indent=2)+"\n")'
          python3 source/tools/plugin_catalog.py publish --key "$key" --out "$RUNNER_TEMP/catalog" --version "$VERSION" --valid-days 365 --plugin-file "$RUNNER_TEMP/homeassistant.json" --target-platform "linux/$ARCH" --release-tag "plugin-ha-v$VERSION" --agent-sha256 "$AGENT_SHA"
          python3 source/tools/plugin_catalog.py verify --trust-root source/config/native/plugin_catalog_trust.pem --catalog "$RUNNER_TEMP/catalog/plugin-catalog.json"
          cp "$RUNNER_TEMP/catalog/plugin-catalog.json" "out/catalog-linux-$ARCH.json"
          cp "$RUNNER_TEMP/catalog/plugin-catalog.json.sig" "out/catalog-linux-$ARCH.json.sig"
      - uses: actions/upload-artifact@v4
        with:
          name: ha-public-linux-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.ref == 'refs/heads/main' && inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source
      - uses: actions/download-artifact@v4
        with:
          pattern: ha-public-linux-*
          path: out
          merge-multiple: true
      - name: Prepare Pages payload and verify updater helper pins
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p pages/plugins pages/tools pages/config/native
          cp out/catalog-linux-amd64.json pages/plugins/
          cp out/catalog-linux-amd64.json.sig pages/plugins/
          cp out/catalog-linux-arm64.json pages/plugins/
          cp out/catalog-linux-arm64.json.sig pages/plugins/
          for file in tools/plugin_bundle.py tools/plugin_catalog.py tools/agent_host.py tools/scope_sync.py config/native/release_manifest.py; do
            install -D -m 0644 "source/$file" "pages/$file"
          done
          python3 - <<'PY'
          import ast, hashlib, pathlib
          updater = pathlib.Path('source/config/native/update.py').read_text()
          tree = ast.parse(updater)
          profiles = next(ast.literal_eval(node.value) for node in tree.body
                          if isinstance(node, ast.Assign) and any(isinstance(t, ast.Name) and t.id == 'PLUGIN_HELPER_PROFILES' for t in node.targets))
          for relative, expected in profiles[0].items():
              path = pathlib.Path('pages') / relative
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f'helper pin mismatch: {relative}')
          print('All public helper files match the updater-pinned profile.')
          PY
          python3 - <<'PY'
          import pathlib
          files = sorted(p for p in pathlib.Path('pages').rglob('*') if p.is_file())
          print('\n'.join(f'{p} {p.stat().st_size}' for p in files))
          PY
          cp -R pages/. source/
      - name: Create immutable-version Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CONNECTOR_COMMIT: ${{ inputs.connector_commit }}
          SDK_TAG: ${{ inputs.sdk_tag }}
          SDK_COMMIT: ${{ inputs.sdk_commit }}
        run: |
          set -euo pipefail
          tag="plugin-ha-v$VERSION"
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<EOF
          Home Assistant connector $VERSION

          Installer source: $GITHUB_SHA
          Connector source: $CONNECTOR_COMMIT
          SDK: $SDK_TAG ($SDK_COMMIT)
          Architectures: linux/amd64, linux/arm64

          Catalog signatures are published separately to install.thingspanel.io after review of the generated Pages pull request.
          EOF
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            target="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)"
            body="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
            if [ "$target" != "$GITHUB_SHA" ] || [ "$body" != "$(cat "$notes")" ]; then
              echo "Existing Release metadata does not match this exact source and input set." >&2
              exit 1
            fi
          else
            tag_target="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$tag" "refs/tags/$tag^{}" | awk -v tag="$tag" '$2 == "refs/tags/" tag "^{}" {print $1; found=1} END {if (!found) {}}')"
            if [ -z "$tag_target" ]; then
              tag_target="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$tag" | awk 'NR == 1 {print $1}')"
            fi
            if [ -n "$tag_target" ] && [ "$tag_target" != "$GITHUB_SHA" ]; then
              echo "Existing tag $tag points at a different source commit." >&2
              exit 1
            fi
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Home Assistant plugin $VERSION" --notes-file "$notes" --draft
          fi
          for file in out/tp-agent-linux-amd64 out/ha-image-linux-amd64.tar out/tp-agent-linux-arm64 out/ha-image-linux-arm64.tar; do
            name="${file#out/}"
            expected="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
            actual="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq ".assets[]? | select(.name == \"$name\") | .digest" | head -n 1)"
            if [ -n "$actual" ]; then
              if [ "$actual" != "$expected" ]; then
                echo "Existing Release asset digest differs: $name" >&2
                exit 1
              fi
            else
              gh release upload "$tag" "$file" --repo "$GITHUB_REPOSITORY"
            fi
          done
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
      - name: Open a reviewable Pages source pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          path: source
          add-paths: |
            plugins/catalog-linux-amd64.json
            plugins/catalog-linux-amd64.json.sig
            plugins/catalog-linux-arm64.json
            plugins/catalog-linux-arm64.json.sig
            tools/plugin_bundle.py
            tools/plugin_catalog.py
            tools/agent_host.py
            tools/scope_sync.py
            config/native/release_manifest.py
          branch: codex/ha-plugin-pages-${{ inputs.version }}
          delete-branch: false
          commit-message: "publish: HA plugin ${{ inputs.version }} catalog and helpers"
          title: "publish: HA plugin ${{ inputs.version }} catalog and helpers"
          body: |
            Publishes the two signed architecture catalogs and the exact updater-pinned helper profile for HA plugin ${{ inputs.version }}.

            The binary Agent and image archives are in GitHub Release `plugin-ha-v${{ inputs.version }}`. This PR must be reviewed and merged before the legacy `main:/` GitHub Pages source exposes the catalog. It is intentionally not auto-merged: a normal reviewed merge commit triggers Pages; a workflow `GITHUB_TOKEN` push alone does not.

            Verify after merge: fetch both catalog JSON/signature pairs and all helper paths from `https://install.thingspanel.io/`, verify signatures with the installer-pinned trust root, and compare helper SHA-256 values with `config/native/update.py`.
          draft: false
