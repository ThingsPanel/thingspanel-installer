name: Build signed Modbus managed plugin
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full SHA in ThingsPanel/modbus-protocol-plugin
        required: true
        type: string
      baseline_release:
        description: Installer release tag containing the signed HA and HTTP assets
        required: false
        type: string
      baseline_run_id:
        description: Installer workflow run ID with the signed HTTP expiry artifacts
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ThingsPanel/modbus-protocol-plugin
          ref: ${{ inputs.source_commit }}
          path: modbus-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ThingsPanel/thingspanel-installer
          ref: 3f5ac1ec4034a6879867be56e54c7c9d1798aa14
          path: catalog-verifier
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build fixed image and validate baseline
        env:
          ARCH: ${{ matrix.arch }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          BASELINE_RELEASE: ${{ inputs.baseline_release }}
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C modbus-source rev-parse HEAD)" = "$SOURCE_COMMIT"
          mkdir -p baseline out
          if [[ -n "$BASELINE_RELEASE" && -z "$BASELINE_RUN_ID" ]]; then
            [[ "$BASELINE_RELEASE" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
            gh release download "$BASELINE_RELEASE" --repo ThingsPanel/thingspanel-installer --dir baseline \
              --pattern "catalog-linux-$ARCH.json*" --pattern "tp-agent-linux-$ARCH" \
              --pattern "ha-image-linux-$ARCH.tar" --pattern "http-image-linux-$ARCH.tar"
          elif [[ -n "$BASELINE_RUN_ID" && -z "$BASELINE_RELEASE" ]]; then
            [[ "$BASELINE_RUN_ID" =~ ^[0-9]+$ ]]
            gh run download "$BASELINE_RUN_ID" --repo ThingsPanel/thingspanel-installer \
              --name "http-expiry-signed-linux-$ARCH" --dir baseline
          else
            echo "Choose exactly one signed baseline source" >&2
            exit 1
          fi
          version="$(python3 -c 'import json; print(json.load(open("packaging/modbus-managed.json"))["version"])')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="thingspanel/modbus-managed:$version-$ARCH"
          docker buildx build --platform "linux/$ARCH" --provenance=false --load -f modbus-source/Dockerfile.managed -t "$tag" modbus-source
          docker image inspect "$tag" > "$RUNNER_TEMP/modbus-image.json"
          docker save -o "out/modbus-image-linux-$ARCH.tar" "$tag"
          baseline="baseline/catalog-linux-$ARCH.json"
          python3 catalog-verifier/tools/plugin_catalog.py verify --trust-root catalog-verifier/config/native/plugin_catalog_trust.pem --catalog "$baseline"
          python3 tools/build_modbus_catalog.py --baseline "$baseline" --image-inspect "$RUNNER_TEMP/modbus-image.json" \
            --image-archive "out/modbus-image-linux-$ARCH.tar" --source-commit "$SOURCE_COMMIT" \
            --installer-commit "$GITHUB_SHA" --output "out/catalog-linux-$ARCH.json"
      - name: Sign and verify the combined catalog
        env:
          ARCH: ${{ matrix.arch }}
          SIGNING_KEY: ${{ secrets.TP_PLUGIN_CATALOG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/modbus-key.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key"
          catalog="out/catalog-linux-$ARCH.json"
          openssl dgst -sha256 -sign "$key" -out "$catalog.sig" "$catalog"
          python3 catalog-verifier/tools/plugin_catalog.py verify --trust-root catalog-verifier/config/native/plugin_catalog_trust.pem --catalog "$catalog"
      - uses: actions/upload-artifact@v4
        with:
          name: modbus-managed-linux-${{ matrix.arch }}
          path: out/*
          retention-days: 14
