name: Build signed HTTP managed plugin
on:
  workflow_call:
    inputs:
      source_commit:
        required: true
        type: string
      installer_commit:
        required: true
        type: string
    secrets:
      TP_PLUGIN_CATALOG_SIGNING_KEY:
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.installer_commit }}
      - uses: actions/checkout@v4
        with:
          repository: ThingsPanel/thingspanel-adapter-http
          ref: ${{ inputs.source_commit }}
          path: http-source
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Verify HTTP source
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          test "$(git -C http-source rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git -C http-source status --porcelain)"
          (cd http-source && go test ./...)
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build fixed HTTP image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p out
          docker buildx build --platform "linux/$ARCH" --provenance=false --load -f http-source/Dockerfile.managed -t "thingspanel/http-managed:1.2.0-$ARCH" http-source
          docker inspect "thingspanel/http-managed:1.2.0-$ARCH" > "$RUNNER_TEMP/image.json"
          docker save -o "out/http-image-linux-$ARCH.tar" "thingspanel/http-managed:1.2.0-$ARCH"
      - name: Preserve HA and sign combined catalog
        env:
          ARCH: ${{ matrix.arch }}
          SIGNING_KEY: ${{ secrets.TP_PLUGIN_CATALOG_SIGNING_KEY }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          INSTALLER_COMMIT: ${{ inputs.installer_commit }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/signing-key.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key"
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/ThingsPanel/thingspanel-installer/72946f1edc51f29ee93462458fd52ea6991492db/plugins/catalog-linux-$ARCH.json" -o "$RUNNER_TEMP/ha.json"
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/ThingsPanel/thingspanel-installer/72946f1edc51f29ee93462458fd52ea6991492db/plugins/catalog-linux-$ARCH.json.sig" -o "$RUNNER_TEMP/ha.json.sig"
          python3 tools/plugin_catalog.py verify --trust-root config/native/plugin_catalog_trust.pem --catalog "$RUNNER_TEMP/ha.json"
          for file in "tp-agent-linux-$ARCH" "ha-image-linux-$ARCH.tar"; do
            curl -fsSL --retry 3 "https://github.com/ThingsPanel/thingspanel-installer/releases/download/plugin-ha-v1.0.0/$file" -o "out/$file"
          done
          python3 tools/build_http_catalog.py
          openssl dgst -sha256 -sign "$key" -out "out/catalog-linux-$ARCH.json.sig" "out/catalog-linux-$ARCH.json"
          python3 tools/plugin_catalog.py verify --trust-root config/native/plugin_catalog_trust.pem --catalog "out/catalog-linux-$ARCH.json"
      - uses: actions/upload-artifact@v4
        with:
          name: http-managed-linux-${{ matrix.arch }}
          path: out/*
          retention-days: 14
