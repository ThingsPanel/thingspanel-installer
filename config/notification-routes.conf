location ~ ^/api/v[12]/(?:notification-(?:plugins|instances|deliveries|ingress|groups|group-projections|plugin-grants)|notifications|notification-source/group-snapshots)(?:/|$) {
    proxy_pass http://notification-core:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/api/v2/platform/notification-tenants(?:/|$) {
    proxy_pass http://notification-core:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
