name: Validate — PR Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'docker-compose.yml'
      - 'niginx.conf'
      - 'install.sh'
      - 'install.ps1'
      - 'install.core.ps1'
      - 'upgrade.sh'
      - 'upgrade.ps1'
      - 'uninstall.sh'
      - 'uninstall.ps1'
      - '*.bash'
      - 'config/native/**'
      - 'packaging/**'
      - '.github/workflows/validate.yml'
      - '.github/workflows/release.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create test .env
        run: |
          cat > .env << 'EOF'
          DATA_DIR=./data
          TZ=Asia/Shanghai
          TP_BROKER_DATABASE_DSN=host=postgres user=postgres password=syntax-check dbname=ThingsPanel sslmode=disable
          TP_JWT_KEY=syntax-check-only
          TP_AUTOMATION_TOKEN=syntax-check-only
          TP_MQTT_USER=syntax-check-only
          TP_MQTT_PASSWORD=syntax-check-only
          TP_PROTOCOL_MQTT_USER=syntax-check-only
          TP_PROTOCOL_MQTT_PASSWORD=syntax-check-only
          TP_NATIVE_DB_PASSWORD=syntax-check-only
          TP_NOTIFICATION_KEYRING_B64=syntax-check-only
          EOF
          python3 config/native/prepare.py

      - name: Validate docker-compose syntax
        run: docker compose config --quiet

      - name: Validate nginx config syntax
        run: |
          if [ -f niginx.conf ]; then
            docker run --rm \
              --add-host backend:127.0.0.1 \
              --add-host thingsvis-server:127.0.0.1 \
              --add-host thingsvis-studio:127.0.0.1 \
              --add-host encore-api:127.0.0.1 \
              --add-host notification-core:127.0.0.1 \
              -v "$PWD/config/native:/run/config:ro" \
              -v "$PWD/niginx.conf:/etc/nginx/nginx.conf:ro" \
              nginx:alpine nginx -t
          fi

      - name: Lint shell scripts (shellcheck)
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          additional_files: 'install.sh upgrade.sh uninstall.sh install.bash'
