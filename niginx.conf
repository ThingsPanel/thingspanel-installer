user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;
    client_max_body_size 1024M;
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 4;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/x-httpd-php image/jpeg image/gif image/png;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.";
    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # Maintenance (R6): while the Agent has a system operation running it keeps the flag file `active` in the status
    # directory (mounted read-only below). Everything except the status file then answers 503, and the static page
    # polls /system-status/status.json (steps, percent, a fixed code; never secrets) and reloads when it is done.
    # Docker's embedded DNS. Upstreams that an upgrade recreates (backend, Encore) are resolved per request through
    # variables below, so a recreated container with a new address is found without restarting this proxy, and a
    # failed backend never takes the maintenance page down with it (compose must not restart this service either).
    resolver 127.0.0.11 valid=3s ipv6=off;

    map $uri $tp_status_path {
        default 0;
        ~^/system-status/ 1;
    }

    server {
        port_in_redirect off;
        listen       8080;
        server_name  _;
        root         /usr/share/nginx/html;

        set $tp_block 0;
        if (-f /usr/share/nginx/status/active) { set $tp_block 1; }
        if ($tp_status_path) { set $tp_block 0; }
        if ($tp_block) { return 503; }
        error_page 502 503 504 @tp_unavailable;

        location = /system-status/status.json {
            alias /usr/share/nginx/status/status.json;
            default_type application/json;
            add_header Cache-Control "no-store";
        }

        location @tp_unavailable {
            default_type text/html;
            add_header Cache-Control "no-store" always;
            if ($request_uri ~ ^/(api|files|automation-core)(/|$)) {
                return 503 '{"code":503,"message":"service unavailable","maintenance":true}';
            }
            return 503 '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ThingsPanel</title></head><body style="font-family:sans-serif;max-width:34em;margin:14vh auto;padding:0 1em;color:#333"><h2 id="t">系统维护中</h2><p id="s">正在读取进度…</p><div style="background:#e8e8e8;height:8px;border-radius:4px"><div id="b" style="background:#2080f0;height:8px;border-radius:4px;width:0"></div></div><p id="n" style="color:#999;font-size:13px"></p><script>var names={preflight:"检查",stopping:"停止服务",starting:"启动服务",verifying:"健康检查",snapshot:"创建升级前备份",staging_release:"下载并校验新版本",applying:"替换配置",starting_new_version:"启动新版本",rolling_back:"出现问题，正在自动回退",restoring_databases:"恢复数据库",restoring_files:"恢复文件",restoring_config:"恢复配置",safety_snapshot:"创建安全备份",maintenance_on:"进入维护"};function tick(){var x=new XMLHttpRequest();x.open("GET","/system-status/status.json?"+Date.now());x.onload=function(){try{var j=JSON.parse(x.responseText);var b=document.getElementById("b"),s=document.getElementById("s"),n=document.getElementById("n");b.style.width=(j.percent||0)+"%";if(j.state==="done"){s.textContent="完成，正在刷新…";location.reload();return}if(j.state==="failed"||j.state==="aborted"){var rb=j.code==="upgrade_failed_rolled_back"||j.code==="restore_failed_rolled_back";s.textContent=rb?"操作失败，系统已自动回退到之前的状态。":"操作失败，需要人工处理。";n.textContent="代码："+(j.code||"")+(j.component?" 组件："+j.component:"");if(rb){setTimeout(function(){location.reload()},4000)}return}s.textContent=(names[j.step]||j.step||"进行中")+(j.component?"（"+j.component+"）":"")+" … "+(j.percent||0)+"%"}catch(e){document.getElementById("s").textContent="系统正在维护，请稍候…"}setTimeout(tick,2000)};x.onerror=function(){setTimeout(tick,3000)};x.send()}tick()</script></body></html>';
        }

        # System management API (Encore): super administrators only, checked by the service itself.
        location ^~ /api/system/ {
            set $tp_encore http://encore-api:14000;
            proxy_pass $tp_encore;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 120s;
        }

        # Internal service identities are never exposed through the browser.
        location = /automation-core/internal { return 404; }
        location ^~ /automation-core/internal/ { return 404; }
        location /automation-core/ {
            set $tp_encore http://encore-api:14000;
            rewrite ^/automation-core/(.*)$ /$1 break;
            proxy_pass $tp_encore;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        location ~ ^/api/v2/(notification[^/]*|platform/notification-tenants)(/|$) {
            set $tp_notification http://notification-core:18091;
            proxy_pass $tp_notification;
            proxy_set_header Host $http_host;
            proxy_set_header Authorization $http_authorization;
        }

        location ~ ^/api/v2/(thing-models|thing-model-commands)(/|$) {
            set $tp_encore http://encore-api:14000;
            proxy_pass $tp_encore;
            proxy_set_header Host $http_host;
            proxy_set_header Authorization $http_authorization;
        }

        location /api {
            set $tp_backend http://backend:9999;
            proxy_pass  $tp_backend;
            proxy_http_version 1.1;
            # Keep the public authority so backend callbacks can reach /thingsvis-api.
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-real-ip $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /files {
            set $tp_backend http://backend:9999;
            proxy_pass  $tp_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-real-ip $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

                # ── ThingsVis Studio 前端入口 ──────────────────────────────────────────
        location /main/ {
            proxy_pass http://thingsvis-studio:3000/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_read_timeout    120s;
        }

        # ThingsVis API 代理
        location /thingsvis-api/ {
            proxy_pass http://thingsvis-server:8000/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection upgrade;
            proxy_buffering off;
            proxy_connect_timeout 60s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

         # ThingsVis widget registry and module federation assets
        location = /registry.json {
            proxy_pass http://thingsvis-studio:3000/registry.json;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /widgets/ {
            proxy_pass http://thingsvis-studio:3000/widgets/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /mf-manifest.json {
            proxy_pass http://thingsvis-studio:3000/mf-manifest.json;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }


        location /static/ {
            proxy_pass http://thingsvis-studio:3000/static/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location / {
            index       index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        error_page 404 /404.html;
            location = /40x.html {
        }

        error_page 500 502 503 504 /50x.html;
            location = /50x.html {
        }

    }
    # Private TLS session endpoint; 8443 is not published to the host.
    server {
        listen 8443 ssl;
        server_name frontend;
        ssl_certificate /run/config/internal.crt;
        ssl_certificate_key /run/config/internal.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        access_log off;
        location /api/v1/notification/ {
            set $tp_backend http://backend:9999;
            proxy_pass $tp_backend;
            proxy_set_header x-token $http_x_token;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Notification-Deployment $http_x_notification_deployment;
        }
        location / { return 404; }
    }

}
