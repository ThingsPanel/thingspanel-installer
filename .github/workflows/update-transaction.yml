name: Installer update transaction

on:
  workflow_call:

jobs:
  transaction:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test staged update, recovery and locking without Docker or network
        run: python -m unittest discover -s tests -v
      - name: Parse PowerShell entrypoints without executing installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($path in @('install.core.ps1', 'upgrade.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "PowerShell parse failed: $path" }
          }
