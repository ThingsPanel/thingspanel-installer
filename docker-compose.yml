services:
  frontend:
    image: registry.cn-hangzhou.aliyuncs.com/thingspanel/thingspanel-vue:v1.4.0.1
    ports:
    - ${HTTP_PORT:-8080}:8080
    - ${TP_PORT_HTTP_ADAPTER:-19090}:19090
    - ${TP_PORT_MODBUS:-502}:1502
    environment:
    - TZ=Asia/Shanghai
    - BACKEND_HOST=http://backend:9999
    depends_on:
      backend:
        condition: service_healthy
        restart: true
      encore-api:
        condition: service_started
        restart: true
      notification-core:
        condition: service_started
        restart: true
      thingsvis-server:
        condition: service_started
        restart: true
      thingsvis-studio:
        condition: service_started
        restart: true
    volumes:
    - ./niginx.conf:/etc/nginx/nginx.conf:ro
    - ./config/native/internal.crt:/run/config/internal.crt:ro
    - ./config/native/internal.key:/run/config/internal.key:ro
    restart: unless-stopped
    networks:
    - thingspanel_network
  postgres:
    image: registry.cn-hangzhou.aliyuncs.com/thingspanel/timescaledb:14
    volumes:
    - postgres_data:/var/lib/postgresql/data
    ports:
    - ${TP_PORT_POSTGRES:-5555}:5432
    environment:
    - TZ=Asia/Shanghai
    - LC_ALL=C.UTF-8
    - POSTGRES_DB=ThingsPanel
    - POSTGRES_USER=postgres
    - POSTGRES_PASSWORD=${TP_DATABASE_PASSWORD:-postgresThingsPanel}
    - POSTGRES_HOST_AUTH_METHOD=md5
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d ThingsPanel
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
    - thingspanel_network
  tdengine:
    profiles:
    - tdengine
    image: ${TP_TDENGINE_IMAGE:-tdengine/tdengine:3.3.6.0}
    environment:
    - TZ=Asia/Shanghai
    volumes:
    - tdengine_data:/var/lib/taos
    healthcheck:
      test:
      - CMD-SHELL
      - curl -sf -u root:${TP_TDENGINE_PASSWORD:-taosdata} -d 'show databases' http://127.0.0.1:6041/rest/sql >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
    - thingspanel_network
  redis:
    image: registry.cn-hangzhou.aliyuncs.com/thingspanel/redis:6.2.7
    command: redis-server --requirepass redis
    volumes:
    - redis_data:/data
    ports:
    - ${TP_PORT_REDIS:-6379}:6379
    environment:
    - TZ=Asia/Shanghai
    healthcheck:
      test:
      - CMD
      - redis-cli
      - -a
      - redis
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
    - thingspanel_network
  backend:
    image: ${TP_BACKEND_IMAGE:-registry.cn-hangzhou.aliyuncs.com/thingspanel/thingspanel-go:v1.4.0.1}
    ports:
    - ${TP_PORT_BACKEND:-9999}:9999
    environment:
    - TZ=Asia/Shanghai
    # Keep the legacy keys while the published v1.3.0 backend image is in use.
    # A1 builds read relational.* and ignore the retired db.psql.* keys.
    - GOTP_DB_PSQL_HOST=postgres
    - GOTP_DB_PSQL_PORT=5432
    - GOTP_DB_PSQL_USERNAME=postgres
    - GOTP_DB_PSQL_PASSWORD=${TP_DATABASE_PASSWORD:-postgresThingsPanel}
    - GOTP_DB_PSQL_DBNAME=ThingsPanel
    - GOTP_DB_PSQL_LOG_LEVEL=3
    - GOTP_RELATIONAL_DRIVER=postgres
    - GOTP_RELATIONAL_POSTGRES_PLATFORM_HOST=postgres
    - GOTP_RELATIONAL_POSTGRES_PLATFORM_PORT=5432
    - GOTP_RELATIONAL_POSTGRES_PLATFORM_DATABASE=ThingsPanel
    - GOTP_RELATIONAL_POSTGRES_PLATFORM_USERNAME=postgres
    - GOTP_RELATIONAL_POSTGRES_PLATFORM_PASSWORD=${TP_DATABASE_PASSWORD:-postgresThingsPanel}
    - GOTP_RELATIONAL_POSTGRES_PLATFORM_LOG_LEVEL=3
    - GOTP_DB_REDIS_ADDR=redis:6379
    - GOTP_DB_REDIS_PASSWORD=redis
    - GOTP_MQTT_SERVER=mosquitto
    - GOTP_MQTT_ACCESS_ADDRESS=mosquitto:1883
    - GOTP_MQTT_BROKER=mosquitto:1883
    - GOTP_LOG_LEVEL=error
    - GOTP_THINGSVIS_PUBLIC_API_BASE_URL=http://thingsvis-server:8000/api/v1
    - TP_MARKETINSTALL_PROVIDER_TOKEN=${TP_MARKETINSTALL_PROVIDER_TOKEN:?generated by native preparation}
    - TP_MARKETINSTALL_THINGSVIS_BASE_URL=http://thingsvis-server:8000
    - TP_MARKETINSTALL_THINGSVIS_IDENTITY_TOKEN=${TP_MARKETINSTALL_THINGSVIS_IDENTITY_TOKEN:?generated by native preparation}
    - TP_MARKETINSTALL_THINGSVIS_TOKEN=${TP_MARKETINSTALL_THINGSVIS_TOKEN:?generated by native preparation}
    - GOTP_MQTT_INPUT_PROFILE=ingress_v1
    - GOTP_STORAGE_HISTORY_BACKEND=${TP_HISTORY_BACKEND:-postgres}
    - GOTP_STORAGE_TDENGINE_EXPERIMENTAL=${TP_TDENGINE_EXPERIMENTAL:-false}
    - GOTP_STORAGE_TDENGINE_URL=http://tdengine:6041
    - GOTP_STORAGE_TDENGINE_USER=root
    - GOTP_STORAGE_TDENGINE_PASSWORD=${TP_TDENGINE_PASSWORD:-taosdata}
    - GOTP_STORAGE_TDENGINE_DATABASE=thingspanel_history
    - GOTP_MQTT_BROKER_CELL=${TP_BROKER_CELL:-community}
    - GOTP_MQTT_BROKER_INSTANCE=${TP_BROKER_INSTANCE:-community-mosquitto}
    - GOTP_MQTT_CLIENT_ID=${TP_MQTT_CLIENT_ID:-tp-community-backend}
    - GOTP_MQTT_USER=${TP_MQTT_USER:?set in .env}
    - GOTP_MQTT_PASS=${TP_MQTT_PASSWORD:?set in .env}
    - GOTP_AUTOMATION_MODE=native
    - GOTP_AUTOMATION_BASE_URL=http://encore-api:14000
    - GOTP_AUTOMATION_TOKEN=${TP_AUTOMATION_TOKEN:?set in .env}
    - GOTP_AUTOMATION_DEPLOYMENT_ID=${TP_DEPLOYMENT_ID:-community}
    - TP_THINGMODEL_NATIVE_URL=http://encore-api:14000
    - GOTP_JWT_KEY=${TP_JWT_KEY:?set in .env}
    - NOTIFICATION_MEMBER_READER_TOKEN=${TP_NOTIFICATION_READER_TOKEN:?generated by native preparation}
    - NOTIFICATION_MEMBER_READER_DEPLOYMENTS=${TP_DEPLOYMENT_ID:-community}
    - TP_AGENT_SOCKET=/run/tp-agent/agent.sock
    - TP_AGENT_TOKEN_FILE=/run/tp-agent/token
    - TP_BROKER_OWNER_URL=https://broker-owner:9801
    - TP_BROKER_TOKEN_FILE=/run/tp-broker/plugin-token
    - TP_BROKER_CELL=${TP_BROKER_CELL:-community}
    - TP_BROKER_INSTANCE=${TP_BROKER_INSTANCE:-community-mosquitto}
    - SSL_CERT_DIR=/etc/ssl/certs:/run/tp-broker/trust
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started
    volumes:
    - go_files:/go/src/app/files
    - go_configs:/go/src/app/configs
    - ${TP_AGENT_RUN_MOUNT:-./.tp-agent/run}:/run/tp-agent:ro
    - ./config/native/broker/plugin-token:/run/tp-broker/plugin-token:ro
    - ./config/native/broker/owner.crt:/run/tp-broker/trust/owner.crt:ro
    restart: unless-stopped
    networks:
    - thingspanel_network
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:9999/health >/dev/null
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s
  thingsvis-server:
    image: ${TP_THINGSVIS_IMAGE:-registry.cn-hangzhou.aliyuncs.com/thingspanel/thingsvis-server:v1.0.23}
    container_name: ${TP_THINGSVIS_SERVER_CONTAINER:-thingsvis-server}
    restart: unless-stopped
    ports:
    - ${TP_PORT_THINGSVIS_API:-8000}:8000
    environment:
    - NODE_ENV=production
    - HOSTNAME=0.0.0.0
    - AUTH_TRUST_HOST=true
    - DATABASE_URL=postgresql://postgres:${TP_DATABASE_PASSWORD:-postgresThingsPanel}@postgres:5432/ThingsPanel?schema=thingsvis
    - DATABASE_PROVIDER=postgresql
    - AUTH_SECRET=${TP_THINGSVIS_AUTH_SECRET:?generated and persisted by native preparation}
    - PLATFORM_API_URL=http://backend:9999
    - MARKET_IDENTITY_INTERNAL_TOKEN=${TP_MARKETINSTALL_THINGSVIS_IDENTITY_TOKEN:?generated by native preparation}
    - MARKET_TEMPLATE_INTERNAL_TOKEN=${TP_MARKETINSTALL_THINGSVIS_TOKEN:?generated by native preparation}
    - COMMUNITY_MARKET_AUTHORIZATION_URL=http://backend:9999/internal/market-install/authorize
    - COMMUNITY_MARKET_AUTHORIZATION_TOKEN=${TP_MARKETINSTALL_PROVIDER_TOKEN:?generated by native preparation}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
    - thingspanel_network
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- --spider http://127.0.0.1:8000/api/v1/health
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
  thingsvis-studio:
    image: registry.cn-hangzhou.aliyuncs.com/thingspanel/thingsvis-studio:v1.0.23
    container_name: ${TP_THINGSVIS_STUDIO_CONTAINER:-thingsvis-studio}
    restart: unless-stopped
    ports:
    - ${TP_PORT_THINGSVIS_STUDIO:-3000}:3000
    environment:
    - STUDIO_PORT=3000
    - SERVER_HOST=thingsvis-server
    - SERVER_PORT=8000
    depends_on:
      thingsvis-server:
        condition: service_healthy
    networks:
    - thingspanel_network
    healthcheck:
      test:
      - CMD-SHELL
      - curl -sf http://127.0.0.1:3000/ || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
  broker-owner:
    image: registry.cn-hangzhou.aliyuncs.com/thingspanel/thingspanel-mosquitto:v1.4.0
    command:
    - owner
    restart: unless-stopped
    networks:
      thingspanel_network:
        aliases:
        - mosquitto
    environment:
      TP_BROKER_OWNER_LISTEN: 0.0.0.0:9801
      TP_BROKER_OWNER_TLS_CERT: /run/secrets/owner.crt
      TP_BROKER_OWNER_TLS_KEY: /run/secrets/owner.pem
      TP_BROKER_OWNER_DATABASE_DSN: ${TP_BROKER_DATABASE_DSN:?set in .env}
      TP_BROKER_OWNER_TOKENS_FILE: /run/secrets/owner-tokens.json
      TP_BROKER_OWNER_SERVICES_FILE: /run/secrets/services.json
    volumes:
    - ./config/native/broker:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
    - ${MQTT_PORT:-1883}:1883
    healthcheck:
      test:
      - CMD
      - /usr/local/bin/tp-broker-readiness
      - owner-liveness
      interval: 5s
      timeout: 3s
      retries: 12
  mosquitto:
    image: registry.cn-hangzhou.aliyuncs.com/thingspanel/thingspanel-mosquitto:v1.4.0
    command:
    - broker
    restart: unless-stopped
    network_mode: service:broker-owner
    depends_on:
      broker-owner:
        condition: service_healthy
    environment:
      TP_BROKER_OWNER_URL: https://127.0.0.1:9801
      SSL_CERT_DIR: /etc/ssl/certs:/run/tp-broker/trust
      TP_BROKER_TOKEN_FILE: /run/secrets/plugin-token
      TP_BROKER_CELL: ${TP_BROKER_CELL:-community}
      TP_BROKER_INSTANCE: ${TP_BROKER_INSTANCE:-community-mosquitto}
    volumes:
    - mosquitto_data:/mosquitto/data
    - ./config/native/broker/owner.crt:/run/tp-broker/trust/owner.crt:ro
    - ./config/native/broker:/run/secrets:ro
  encore-api:
    image: registry.cn-hangzhou.aliyuncs.com/thingspanel/thingspanel-encore:v1.4.0.1
    restart: unless-stopped
    networks:
    - thingspanel_network
    environment:
      TP_AUTH_MODE: legacy-jwt
      TP_JWT_KEY: ${TP_JWT_KEY:?set in .env}
      TP_COMMUNITY_BASE_URL: http://backend:9999
      TP_COMMUNITY_SESSION_BASE_URL: http://backend:9999
      TP_AUTOMATION_SERVICE_TOKEN: ${TP_AUTOMATION_TOKEN:?set in .env}
      NOTIFICATION_SERVICE_TOKEN: ${TP_NOTIFICATION_SERVICE_TOKEN:?generated by native preparation}
      TP_NOTIFICATION_SOURCE_READER_TOKEN: ${TP_NOTIFICATION_READER_TOKEN:?generated by native preparation}
      TP_NOTIFICATION_URL: http://notification-core:18091
      METADATA_CREDENTIAL_KEYRING_B64: ${METADATA_CREDENTIAL_KEYRING_B64:?generated by native preparation}
      METADATA_CREDENTIAL_ACTIVE_KEY_REF: ${METADATA_CREDENTIAL_ACTIVE_KEY_REF:-main}
      TP_BACKGROUND_WORKERS: 'on'
      TP_RUNTIME_OUTBOX_DISPATCH: 'on'
      TP_DEVICE_CONNECTION_ENDPOINT: ${TP_DEVICE_CONNECTION_ENDPOINT:-}
      TP_SOURCE_DEPLOYMENT_ID: ${TP_DEPLOYMENT_ID:-community}
      DB_DEVICE_METADATA_PASSWORD: ${TP_NATIVE_DB_PASSWORD:?set in .env}
      DB_AUTOMATION_PASSWORD: ${TP_NATIVE_DB_PASSWORD:?set in .env}
      DB_NOTIFICATION_PASSWORD: ${TP_NATIVE_DB_PASSWORD:?set in .env}
      PORT: '14000'
      ENCORE_LISTEN_ADDR: 0.0.0.0:14000
      ENCORE_INFRA_CONFIG_PATH: /run/config/runtime.json
    volumes:
    - ./config/native/runtime.encore.json:/run/config/runtime.json:ro
    depends_on:
      postgres:
        condition: service_healthy
  notification-smtp:
    image: ${TP_BACKEND_IMAGE:-registry.cn-hangzhou.aliyuncs.com/thingspanel/thingspanel-go:v1.4.0.1}
    entrypoint: ["/usr/local/bin/notification-smtp"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [thingspanel_network]
    environment:
      NOTIFICATION_PLUGIN_LISTEN: ":5443"
      NOTIFICATION_ALLOW_UNCONFIGURED: "true"
      NOTIFICATION_TLS_CERT: /run/identity.pem
      NOTIFICATION_TLS_KEY: /run/identity.pem
      NOTIFICATION_PLUGIN_TOKEN: ${TP_NOTIFICATION_SMTP_ADAPTER_TOKEN:?generated by native preparation}
      NOTIFICATION_SMTP_ALLOWED_SERVERS: ${TP_SMTP_ALLOWED_SERVERS:-}
      NOTIFICATION_SMTP_ALLOWED_CIDRS: ${TP_SMTP_ALLOWED_CIDRS:-}
    volumes:
    - ./config/native/notification-smtp.pem:/run/identity.pem:ro
  notification-unipush:
    image: ${TP_BACKEND_IMAGE:-registry.cn-hangzhou.aliyuncs.com/thingspanel/thingspanel-go:v1.4.0.1}
    entrypoint: ["/usr/local/bin/notification-unipush"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [thingspanel_network]
    environment:
      NOTIFICATION_PLUGIN_LISTEN: ":5443"
      NOTIFICATION_ALLOW_UNCONFIGURED: "true"
      NOTIFICATION_TLS_CERT: /run/identity.pem
      NOTIFICATION_TLS_KEY: /run/identity.pem
      NOTIFICATION_PLUGIN_TOKEN: ${TP_NOTIFICATION_UNIPUSH_ADAPTER_TOKEN:?generated by native preparation}
      SSL_CERT_FILE: /run/internal-ca.pem
      NOTIFICATION_UNIPUSH_ENDPOINT: ${TP_UNIPUSH_ENDPOINT:-}
      NOTIFICATION_UNIPUSH_CLOUD_TOKEN: ${TP_UNIPUSH_CLOUD_TOKEN:-}
      NOTIFICATION_UNIPUSH_DIRECTORY_URL: https://frontend:8443
      NOTIFICATION_UNIPUSH_DIRECTORY_TOKEN: ${TP_NOTIFICATION_READER_TOKEN:?generated by native preparation}
      NOTIFICATION_UNIPUSH_DEPLOYMENT_ID: ${TP_DEPLOYMENT_ID:-community}
      NOTIFICATION_UNIPUSH_APP_ID: ${APP_PUSH_APP_ID:-__UNI__71E31D5}
    volumes:
    - ./config/native/notification-unipush.pem:/run/identity.pem:ro
    - ./config/native/internal-ca.pem:/run/internal-ca.pem:ro
  notification-core:
    image: registry.cn-hangzhou.aliyuncs.com/thingspanel/thingspanel-encore:v1.4.0.1
    restart: unless-stopped
    networks:
    - thingspanel_network
    environment:
      TP_AUTH_MODE: legacy-jwt
      TP_JWT_KEY: ${TP_JWT_KEY:?set in .env}
      TP_COMMUNITY_BASE_URL: http://backend:9999
      TP_COMMUNITY_SESSION_BASE_URL: http://backend:9999
      TP_AUTOMATION_SERVICE_TOKEN: ${TP_AUTOMATION_TOKEN:?set in .env}
      TP_SOURCE_DEPLOYMENT_ID: ${TP_DEPLOYMENT_ID:-community}
      DB_DEVICE_METADATA_PASSWORD: ${TP_NATIVE_DB_PASSWORD:?set in .env}
      DB_AUTOMATION_PASSWORD: ${TP_NATIVE_DB_PASSWORD:?set in .env}
      DB_NOTIFICATION_PASSWORD: ${TP_NATIVE_DB_PASSWORD:?set in .env}
      PORT: '18091'
      ENCORE_LISTEN_ADDR: 0.0.0.0:18091
      ENCORE_INFRA_CONFIG_PATH: /run/config/runtime.json
      NOTIFICATION_ENCORE_INFRA_CONFIG_PATH: /run/config/runtime.json
      NOTIFICATION_KEYRING_B64: ${TP_NOTIFICATION_KEYRING_B64:?set in .env}
      NOTIFICATION_ACTIVE_KEY_REF: main
      NOTIFICATION_DEFAULT_SMTP_BOOTSTRAP: "true"
      NOTIFICATION_DEFAULT_SMTP_PLUGIN_ORIGIN: https://notification-smtp:5443
      NOTIFICATION_DEFAULT_SMTP_PLUGIN_TOKEN: ${TP_NOTIFICATION_SMTP_ADAPTER_TOKEN:?generated by native preparation}
      NOTIFICATION_DEFAULT_UNIPUSH_BOOTSTRAP: "true"
      NOTIFICATION_DEFAULT_UNIPUSH_PLUGIN_ORIGIN: https://notification-unipush:5443
      NOTIFICATION_DEFAULT_UNIPUSH_PLUGIN_TOKEN: ${TP_NOTIFICATION_UNIPUSH_ADAPTER_TOKEN:?generated by native preparation}
      NOTIFICATION_PLUGIN_ALLOWED_ORIGINS: '${TP_NOTIFICATION_PLUGIN_ORIGINS:-["https://notification-smtp:5443","https://notification-unipush:5443"]}'
      NOTIFICATION_PLUGIN_ALLOWED_CIDRS: '${TP_NOTIFICATION_PLUGIN_CIDRS:-["172.16.0.0/12","10.0.0.0/8","192.168.0.0/16","fc00::/7"]}'
      NOTIFICATION_LEGACY_BASE_URL: https://frontend:8443
      NOTIFICATION_SERVICE_TOKEN: ${TP_NOTIFICATION_SERVICE_TOKEN:?generated by native preparation}
      NOTIFICATION_SOURCE_DEPLOYMENT_ID: ${TP_DEPLOYMENT_ID:-community}
      NOTIFICATION_LEGACY_READER_TOKEN: ${TP_NOTIFICATION_READER_TOKEN:?generated by native preparation}
      SSL_CERT_FILE: /run/config/internal-ca.pem
    volumes:
    - ./config/native/runtime.notification.json:/run/config/runtime.json:ro
    - ./config/native/internal-ca.pem:/run/config/internal-ca.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      notification-smtp:
        condition: service_started
      notification-unipush:
        condition: service_started
  automation-scheduler:
    image: registry.cn-hangzhou.aliyuncs.com/thingspanel/thingspanel-go:v1.4.0.1
    entrypoint:
    - /bin/sh
    - /run/config/tick.sh
    restart: unless-stopped
    environment:
      TP_AUTOMATION_SERVICE_TOKEN: ${TP_AUTOMATION_TOKEN:?set in .env}
      TP_SOURCE_DEPLOYMENT_ID: ${TP_DEPLOYMENT_ID:-community}
    volumes:
    - ./config/native/tick.sh:/run/config/tick.sh:ro
    networks:
    - thingspanel_network
    depends_on:
    - encore-api
    healthcheck:
      test:
      - CMD
      - test
      - -f
      - /tmp/last-tick-ok
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s
volumes:
  agent_run: null
  go_files: null
  go_configs: null
  postgres_data: null
  tdengine_data: null
  redis_data: null
  mosquitto_data: null
networks:
  thingspanel_network:
    driver: bridge
