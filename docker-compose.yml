services:
  frontend:
    image: registry.cn-hangzhou.aliyuncs.com/thingspanel/thingspanel-vue:v1.2.2
    ports:
      - "8080:8080"
    environment:
      - "TZ=Asia/Shanghai"
      - "BACKEND_HOST=http://backend:9999"
    depends_on:
      backend:
        condition: service_started
    volumes:
      - nginx:/etc/nginx
    restart: unless-stopped
    networks:
      - thingspanel_network

  postgres:
    image: registry.cn-hangzhou.aliyuncs.com/thingspanel/timescaledb:14
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    ports:
      - "5555:5432"
    environment:
      - "TZ=Asia/Shanghai"
      - "LC_ALL=C.UTF-8"
      - "POSTGRES_DB=ThingsPanel"
      - "POSTGRES_USER=postgres"
      - "POSTGRES_PASSWORD=postgresThingsPanel"
      - "POSTGRES_HOST_AUTH_METHOD=md5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ThingsPanel"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - thingspanel_network

  gmqtt:
    image: registry.cn-hangzhou.aliyuncs.com/thingspanel/thingspanel-gmqtt:v1.1.7
    volumes:
      - gmqtt:/gmqttd
    ports:
      - "1883:1883"
      - "8082:8082"
      - "8083:8083"
    environment:
      - "TZ=Asia/Shanghai"
      - "GMQTT_DB_REDIS_CONN=redis:6379"
      - "GMQTT_DB_REDIS_PASSWORD=redis"
      - "GMQTT_DB_PSQL_PSQLADDR=postgres"
      - "GMQTT_DB_PSQL_PSQLPORT=5432"
      - "GMQTT_DB_PSQL_PSQLDB=ThingsPanel"
      - "GMQTT_DB_PSQL_PSQLUSER=postgres"
      - "GMQTT_DB_PSQL_PSQLPASS=postgresThingsPanel"
    hostname: gmqtt
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - thingspanel_network

  redis:
    image: registry.cn-hangzhou.aliyuncs.com/thingspanel/redis:6.2.7
    command: redis-server --requirepass redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    environment:
      - "TZ=Asia/Shanghai"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - thingspanel_network

  backend:
    image: registry.cn-hangzhou.aliyuncs.com/thingspanel/thingspanel-go:v1.2.2
    ports:
      - "9999:9999"
    environment:
      - "TZ=Asia/Shanghai"
      - "GOTP_DB_PSQL_HOST=postgres"
      - "GOTP_DB_PSQL_PORT=5432"
      - "GOTP_DB_PSQL_USERNAME=postgres"
      - "GOTP_DB_PSQL_PASSWORD=postgresThingsPanel"
      - "GOTP_DB_PSQL_DBNAME=ThingsPanel"
      - "GOTP_DB_PSQL_LOG_LEVEL=3"
      - "GOTP_DB_REDIS_ADDR=redis:6379"
      - "GOTP_DB_REDIS_PASSWORD=redis"
      - "GOTP_MQTT_SERVER=gmqtt"
      - "GOTP_MQTT_ACCESS_ADDRESS=gmqtt:1883"
      - "GOTP_MQTT_BROKER=gmqtt:1883"
      - "GOTP_LOG_LEVEL=error"
      - "TP_JWT_KEY=${TP_JWT_KEY:-1hj5b0sp9}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gmqtt:
        condition: service_started
    volumes:
      - go_files:/go/src/app/files
      - go_configs:/go/src/app/configs
    restart: unless-stopped
    networks:
      - thingspanel_network

  thingmodel-api:
    image: registry.cn-hangzhou.aliyuncs.com/thingspanel/thingmodel-api:latest
    # 不对外暴露端口 — 通过 nginx /proxy-thingmodel/ 内部代理访问
    environment:
      - "TZ=Asia/Shanghai"
      - "TP_AUTH_MODE=legacy-jwt"
      - "TP_JWT_KEY=${TP_JWT_KEY:-1hj5b0sp9}"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgresThingsPanel}"
      - "ENCORE_INFRA_CONFIG_PATH=/run/config/runtime.json"
      - "TP_LEGACY_DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:-postgresThingsPanel}@postgres:5432/ThingsPanel?sslmode=disable"
    volumes:
      - ./config/thingmodel-runtime.json:/run/config/runtime.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - thingspanel_network

  modbus_service:
    image: registry.cn-hangzhou.aliyuncs.com/thingspanel/modbus-protocol-plugin:v1.0.6.1
    ports:
      - "502:502"
      - "503:503"
    environment:
      - "MODBUS_THINGSPANEL_ADDRESS=http://backend:9999"
      - "MODBUS_MQTT_BROKER=gmqtt:1883"
      - "MODBUS_MQTT_QOS=0"
      - "MODBUS_EXCEPTION_REPORT_ENABLED=true"
    networks:
      - thingspanel_network
    depends_on:
      - backend
      - gmqtt
    restart: unless-stopped

  http_adapter:
    image: registry.cn-hangzhou.aliyuncs.com/thingspanel/thingspanel-adapter-http:v1.0.0
    ports:
      - "19090:19090"
      - "19091:19091"
    environment:
      - "TZ=Asia/Shanghai"
      - "P_SERVER_PORT=19090"
      - "P_SERVER_HTTP_PORT=19091"
      - "P_PLATFORM_URL=http://backend:9999"
      - "P_PLATFORM_MQTT_BROKER=tcp://gmqtt:1883"
    networks:
      - thingspanel_network
    depends_on:
      - backend
      - gmqtt
  thingsvis-server:
    image: registry.cn-hangzhou.aliyuncs.com/thingspanel/thingsvis-server:v1.0.13
    container_name: thingsvis-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - AUTH_TRUST_HOST=true
      - DATABASE_URL=postgresql://postgres:postgresThingsPanel@postgres:5432/ThingsPanel?schema=thingsvis
      - AUTH_SECRET=your-super-secret-auth-key
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - thingspanel_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --spider http://127.0.0.1:8000/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  thingsvis-studio:
    image: registry.cn-hangzhou.aliyuncs.com/thingspanel/thingsvis-studio:v1.0.13
    container_name: thingsvis-studio
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - STUDIO_PORT=3000
      - SERVER_HOST=thingsvis-server
      - SERVER_PORT=8000
    depends_on:
      thingsvis-server:
        condition: service_healthy
    networks:
      - thingspanel_network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  go_files:
  go_configs:
  gmqtt:
  nginx:
  postgres_data:
  redis_data:

networks:
  thingspanel_network:
    driver: bridge
